name: Validate analysis

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install exact legacy runtime requirements
        run: python -m pip install -r requirements.txt
      - name: Run offline tokenizer and cache unit tests
        run: python -m unittest discover -s tests -p 'test_legacy_*.py' -v

      # Main currently contains the lightweight exploratory project. This
      # branch-level check keeps validation deterministic without fetching
      # Project Gutenberg texts.
      - name: Validate legacy Python source
        if: ${{ hashFiles('pyproject.toml') == '' }}
        run: python -m compileall -q analysis

      # The research-architecture PR adds a package, tests, CLI, and notebook.
      # When those files are present in the pull-request merge ref, validate
      # them without running the live corpus-download pipeline.
      - name: Install package and test dependencies
        if: ${{ hashFiles('pyproject.toml') != '' }}
        run: python -m pip install -e ".[dev]"
      - name: Run unit tests
        if: ${{ hashFiles('pyproject.toml') != '' }}
        run: pytest
      - name: Validate Python imports and CLI wiring
        if: ${{ hashFiles('pyproject.toml') != '' }}
        run: |
          python -m compileall -q src analysis
          python -m stevenson_text.cli --help > /dev/null
      - name: Validate research notebook JSON
        if: ${{ hashFiles('notebooks/hyde_and_hand_case_study.ipynb') != '' }}
        run: python -m json.tool notebooks/hyde_and_hand_case_study.ipynb > /dev/null
