name: Validate analysis

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run unit tests
        run: pytest
      - name: Compile Python sources
        run: python -m compileall -q src analysis
      - name: Smoke-test CLI entry point
        run: python -m stevenson_text.cli --help > /dev/null
      - name: Validate research notebook JSON
        run: python -m json.tool notebooks/hyde_and_hand_case_study.ipynb > /dev/null
