name: Validate analysis

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run unit tests
        run: pytest
      - name: Run original exploratory analysis
        timeout-minutes: 3
        run: python analysis/compare_texts.py
      - name: Run reproducible research pipeline
        timeout-minutes: 5
        run: python -m stevenson_text.cli --output outputs
      - name: Validate research notebook JSON
        run: python -m json.tool notebooks/hyde_and_hand_case_study.ipynb > /dev/null
